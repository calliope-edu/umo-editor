name: calliope-build

# Builds the editor for Calliope Campus and pushes the build to a build
# branch, one commit per build:
#
#   /editors/umo/   the editor as Calliope Campus embeds it: Campus serves it
#                   itself under that path on its own origin
#                   (calliope-campus docs/editors.md)
#   /BUILD.json     the same build info at the branch root
#
# UMO has no site of its own, so unlike the other editors there is no build
# for the root.
#
# Which branch:
#
#   tag calliope-vX.Y.Z      → build-live  (Campus pins it)
#   push to calliope-main    → build-dev   (umo-dev.calliope.cc, campus-dev)
#
# Each build branch is ready to serve as it is: a Cloudflare Pages project on
# it needs no build command and the repository root as its output directory
# (`calliope-umo-dev` on build-dev, for campus-dev's editors proxy). Each
# commit carries BUILD.json (at the root and in editors/umo/; format in
# docs/build-info.md) naming channel, version and source commit; the build
# compiles the same values in and logs them once. Campus pins a commit of
# build-live as its editors/umo submodule and moves the pin itself, so nothing
# built here reaches campus.calliope.cc unreviewed.
#
# The build branches only ever grow: Campus release tags pin their older
# commits, so rewriting them would break those builds.

on:
  push:
    branches:
      - calliope-main
    tags:
      - calliope-v*
  workflow_dispatch:

# One build after the other per build branch, so every build lands in order.
concurrency:
  group: calliope-build-${{ github.ref_type }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm, not pnpm: the editor imports a transitive dayjs that pnpm's strict
      # layout hides (CAMPUS.md). --ignore-scripts skips husky's git hook.
      - run: npm ci --ignore-scripts --no-audit --no-fund

      # One set of build values for the build and its BUILD.json
      # (bin/build-info.js; vite.config.js compiles them in).
      - name: Build info
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          channel=dev
          if [ "$REF_TYPE" = tag ]; then channel=live; fi
          {
            echo "BUILD_CHANNEL=$channel"
            echo "BUILD_VERSION=$REF_NAME"
            echo "BUILD_COMMIT=$SHA"
            echo "BUILD_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Build for Campus (/editors/umo/)
        run: npm run build:campus && mkdir -p "$RUNNER_TEMP/out/editors/umo" && cp -r dist/. "$RUNNER_TEMP/out/editors/umo/"
        env:
          # Every asset and the editor's libraries (external/) under this path.
          UMO_BASE: /editors/umo/

      - name: Push the build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          name=umo
          target=build-dev
          if [ "$REF_TYPE" = tag ]; then target=build-live; fi
          short=${SOURCE_SHA:0:7}
          out="$RUNNER_TEMP/out"
          # The same values the build compiled in (step "Build info").
          node bin/build-info.js > "$out/BUILD.json"
          cp "$out/BUILD.json" "$out/editors/$name/BUILD.json"
          cat "$out/BUILD.json"
          mkdir publish && cd publish
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin "$target"; then
            git checkout -q -b "$target" FETCH_HEAD
          else
            git checkout -q --orphan "$target"
          fi
          git rm -rqf --ignore-unmatch .
          cp -r "$out/." .
          # Build output, kept byte for byte: no line-ending conversion on checkout.
          printf '# Build output, kept byte for byte (no line-ending conversion on checkout).\n* -text\n' > .gitattributes
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "build ${short} from ${SOURCE_REF}" -m "Source: https://github.com/${REPO}/commit/${SOURCE_SHA}"
          git push -q origin "$target"
          echo "### ${target}: build ${short} from ${SOURCE_REF}" >> "$GITHUB_STEP_SUMMARY"
